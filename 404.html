    <!-- 尽早采集 FP/FCP/LCP，数据存到 window.__perfMetrics -->
    <script>
      (function () {
        var d = {};
        try {
          new PerformanceObserver(function (list) {
            list.getEntries().forEach(function (e) {
              if (e.name === "first-paint" && d.firstPaintMs == null)
                d.firstPaintMs = Math.round(e.startTime);
              if (e.name === "first-contentful-paint" && d.fcpMs == null)
                d.fcpMs = Math.round(e.startTime);
            });
          }).observe({ type: "paint", buffered: true });
          new PerformanceObserver(function (list) {
            var entries = list.getEntries();
            if (entries.length)
              d.fmpMs = Math.round(entries[entries.length - 1].startTime);
          }).observe({ type: "largest-contentful-paint", buffered: true });
        } catch (e) {}
        window.__perfMetrics = d;
      })();
    </script>

    <script>
      (function () {
        var loadingTextByLocale = {
          en: "Loading...",
          es: "Cargando...",
          ja: "読み込み中...",
          ko: "로딩 중...",
          zh: "加载中...",
          "zh-HK": "加載中...",
        };

        function readCookie(name) {
          var escapedName = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          var match = document.cookie.match(new RegExp("(?:^|; )" + escapedName + "=([^;]*)"));
          return match ? decodeURIComponent(match[1]) : "";
        }

        function normalizeLocale(value) {
          var normalized = String(value || "").trim();
          if (!normalized) {
            return "en";
          }
          var lower = normalized.toLowerCase();
          if (
            lower.indexOf("zh-hk") === 0 ||
            lower.indexOf("zh-mo") === 0 ||
            lower.indexOf("zh-tw") === 0 ||
            lower.indexOf("zh-hant") === 0
          ) {
            return "zh-HK";
          }
          if (lower.indexOf("zh") === 0) {
            return "zh";
          }
          if (lower.indexOf("ja") === 0) {
            return "ja";
          }
          if (lower.indexOf("ko") === 0) {
            return "ko";
          }
          if (lower.indexOf("es") === 0) {
            return "es";
          }
          if (lower.indexOf("en") === 0) {
            return "en";
          }
          return "en";
        }

        var locale = "en";
        try {
          locale = normalizeLocale(
            localStorage.getItem("ojo.locale") ||
              localStorage.getItem("zk.locale") ||
              readCookie("ojo_locale") ||
              readCookie("zk_locale") ||
              navigator.language,
          );
        } catch (e) {
          locale = normalizeLocale(navigator.language);
        }

        var loadingText = document.getElementById("ojo-html-loading-text");
        if (loadingText) {
          loadingText.textContent = loadingTextByLocale[locale] || loadingTextByLocale.en;
        }
      })();
    </script>

    <script>
      // 阻止触控板手势导航，但保留画布平移功能
      window.addEventListener(
        "wheel",
        (e) => {
          // 阻止浏览器缩放（避免与画布缩放手势冲突）
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
            return;
          }

          // 阻止任何水平滚动导致的浏览器前进/后退手势
          if (e.deltaX !== 0) {
            e.preventDefault();
          }
        },
        { passive: false, capture: true },
      );

      document.addEventListener("keydown", (e) => {
        if (
          (e.ctrlKey || e.metaKey) &&
          (e.key === "+" ||
            e.key === "-" ||
            e.key === "=" ||
            e.keyCode === 187 ||
            e.keyCode === 189)
        ) {
          e.preventDefault();
        }
        // 阻止 Ctrl/Cmd + 0 重置缩放
        if ((e.ctrlKey || e.metaKey) && (e.key === "0" || e.keyCode === 48)) {
          e.preventDefault();
        }
      });
    </script>
